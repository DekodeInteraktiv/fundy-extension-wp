name: Release to WordPress.org

on:
    release:
        types: [released]

    workflow_dispatch:

concurrency:
    group: wp-org-release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    deploy:
        name: Deploy to WordPress.org
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Check version numbers
              id: version
              run: |
                  VERSION=$(sed -n 's/^ \* Version: *//p' dekode-fundraising.php | tr -d '[:space:]')
                  CONSTANT=$(sed -n "s/.*'FUNDY_VERSION', '\([^']*\)'.*/\1/p" dekode-fundraising.php)
                  STABLE=$(sed -n 's/^Stable tag: *//p' README.txt | tr -d '[:space:]')
                  echo "Header $VERSION, FUNDY_VERSION $CONSTANT, Stable tag $STABLE"
                  if [ -z "$VERSION" ] || [ "$VERSION" != "$CONSTANT" ] || [ "$VERSION" != "$STABLE" ]; then
                      echo "::error::Version numbers disagree: header $VERSION, FUNDY_VERSION $CONSTANT, Stable tag $STABLE"
                      exit 1
                  fi
                  if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
                      echo "::error::Release tag $GITHUB_REF_NAME does not match plugin version $VERSION"
                      exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Setup node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  check-latest: true
                  cache: npm

            - name: Install NPM dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Package plugin
              run: |
                  npm run plugin-zip
                  mv fundy-extension-wp.zip dekode-fundraising.zip
                  unzip -q dekode-fundraising.zip -d plugin-build

            - name: Deploy to WordPress.org
              uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
              with:
                  dry-run: ${{ github.event_name != 'release' }}
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SLUG: dekode-fundraising
                  VERSION: ${{ steps.version.outputs.version }}
                  BUILD_DIR: ./plugin-build/dekode-fundraising

            - name: Attach zip to the GitHub release
              if: github.event_name == 'release'
              uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
              with:
                  files: dekode-fundraising.zip
